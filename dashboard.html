<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dashboard | MoreMoments</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f4f0eb;

    color:
        #27231f;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font:inherit;
}


/* ============================
   HEADER
============================ */

.header{

    position:sticky;

    top:0;

    z-index:50;

    background:
        rgba(
            250,
            248,
            245,
            .95
        );

    backdrop-filter:
        blur(12px);

    border-bottom:
        1px solid
        #e6ddd5;
}


.header-inner{

    max-width:
        1180px;

    min-height:
        72px;

    margin:auto;

    padding:
        0
        20px;

    display:flex;

    align-items:center;

    justify-content:
        space-between;

    gap:15px;
}


.logo{

    font-size:
        22px;

    font-weight:
        800;
}


.logo span{

    color:
        #a77852;
}


.header-actions{

    display:flex;

    align-items:center;

    gap:8px;
}


.create{

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:
        42px;

    padding:
        0
        17px;

    border-radius:
        999px;

    background:
        #29251f;

    color:
        white;

    font-size:
        13px;

    font-weight:
        700;
}


.logout{

    min-height:
        42px;

    padding:
        0
        15px;

    border:
        1px solid
        #ddd4cc;

    border-radius:
        999px;

    background:
        white;

    cursor:pointer;

    font-size:
        12px;

    font-weight:
        700;
}



/* ============================
   PAGE
============================ */

.page{

    max-width:
        1180px;

    margin:auto;

    padding:
        45px
        20px
        90px;
}


.eyebrow{

    color:
        #a77852;

    font-size:
        11px;

    font-weight:
        800;

    letter-spacing:
        1.7px;

    text-transform:
        uppercase;

    margin-bottom:
        8px;
}


.hero h1{

    font-family:
        Georgia,
        serif;

    font-size:
        clamp(
            36px,
            5vw,
            56px
        );

    font-weight:
        normal;

    line-height:
        1.05;

    margin-bottom:
        10px;
}


.hero p{

    max-width:
        560px;

    color:
        #756e67;

    font-size:
        14px;

    line-height:
        1.6;
}



/* ============================
   SUMMARY
============================ */

.summary{

    margin-top:
        30px;

    margin-bottom:
        30px;

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(
                0,
                1fr
            )
        );

    gap:
        12px;
}


.summary-card{

    padding:
        18px;

    background:
        #fff;

    border:
        1px solid
        #e5dcd3;

    border-radius:
        20px;
}


.summary-card small{

    display:block;

    margin-bottom:
        8px;

    color:
        #8b837c;

    font-size:
        11px;
}


.summary-card strong{

    display:block;

    font-size:
        28px;
}



/* ============================
   TOOLBAR
============================ */

.toolbar{

    display:flex;

    align-items:center;

    justify-content:
        space-between;

    gap:
        12px;

    margin-bottom:
        16px;
}


.toolbar h2{

    font-size:
        19px;
}


.refresh{

    padding:
        10px
        15px;

    border:
        1px solid
        #ddd4cc;

    border-radius:
        999px;

    background:
        white;

    cursor:pointer;

    font-size:
        12px;

    font-weight:
        700;
}



/* ============================
   STATUS BOX
============================ */

.status-box{

    padding:
        35px
        20px;

    border:
        1px solid
        #e5dcd3;

    border-radius:
        22px;

    background:
        white;

    text-align:center;

    color:
        #777;
}



/* ============================
   EVENTS
============================ */

.events{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap:
        16px;
}


.event-card{

    padding:
        22px;

    background:
        white;

    border:
        1px solid
        #e5dcd3;

    border-radius:
        24px;

    box-shadow:
        0
        12px
        30px
        rgba(
            66,
            49,
            37,
            .05
        );
}


.event-head{

    display:flex;

    justify-content:
        space-between;

    align-items:
        flex-start;

    gap:
        14px;

    margin-bottom:
        18px;
}


.event-type{

    color:
        #a77852;

    font-size:
        10px;

    font-weight:
        800;

    letter-spacing:
        1.4px;

    text-transform:
        uppercase;

    margin-bottom:
        6px;
}


.event-name{

    font-family:
        Georgia,
        serif;

    font-size:
        25px;

    font-weight:
        normal;

    line-height:
        1.15;

    overflow-wrap:
        anywhere;
}


.status{

    flex:
        0
        0
        auto;

    padding:
        7px
        10px;

    border-radius:
        999px;

    background:
        #edf6ee;

    color:
        #397146;

    font-size:
        10px;

    font-weight:
        800;

    text-transform:
        uppercase;
}


.status.inactive{

    background:
        #f4eeee;

    color:
        #876b6b;
}


.date{

    color:
        #716a63;

    font-size:
        13px;

    line-height:
        1.6;

    margin-bottom:
        18px;
}



/* ============================
   EVENT STATS
============================ */

.stats{

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(
                0,
                1fr
            )
        );

    gap:
        8px;

    margin-bottom:
        16px;
}


.stat{

    padding:
        12px
        10px;

    border-radius:
        14px;

    background:
        #f8f5f2;
}


.stat small{

    display:block;

    margin-bottom:
        5px;

    color:
        #948b83;

    font-size:
        10px;
}


.stat strong{

    font-size:
        14px;
}


.slug{

    overflow:hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;

    margin-bottom:
        16px;

    padding:
        11px
        12px;

    border-radius:
        12px;

    background:
        #f8f5f2;

    color:
        #7d756e;

    font-size:
        11px;
}



/* ============================
   BUTTONS
============================ */

.actions{

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:
        8px;
}


.action{

    min-height:
        43px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        0
        12px;

    border:
        1px solid
        #ded4cc;

    border-radius:
        999px;

    background:
        white;

    color:
        #332e29;

    cursor:pointer;

    font-size:
        12px;

    font-weight:
        700;
}


.action.primary{

    border-color:
        #29251f;

    background:
        #29251f;

    color:
        white;
}


.action.full{

    grid-column:
        1 / -1;
}



/* ============================
   TOAST
============================ */

.toast{

    position:fixed;

    left:50%;

    bottom:
        25px;

    z-index:
        100;

    transform:
        translate(
            -50%,
            20px
        );

    padding:
        12px
        18px;

    border-radius:
        999px;

    background:
        #29251f;

    color:
        white;

    font-size:
        12px;

    opacity:
        0;

    pointer-events:
        none;

    transition:
        .2s;
}


.toast.show{

    opacity:
        1;

    transform:
        translate(
            -50%,
            0
        );
}



/* ============================
   MOBILE
============================ */

@media(
    max-width:
    760px
){

    .events{

        grid-template-columns:
            1fr;

    }

}


@media(
    max-width:
    520px
){

    .header-inner{

        padding:
            0
            14px;

    }


    .create{

        padding:
            0
            13px;

    }


    .logout{

        padding:
            0
            11px;

    }


    .page{

        padding:
            30px
            15px
            70px;

    }


    .summary-card{

        padding:
            14px
            9px;

    }


    .summary-card strong{

        font-size:
            21px;

    }


    .event-card{

        padding:
            18px;

    }

}

</style>
</head>


<body>


<header class="header">

    <div class="header-inner">

        <a
            href="index.html"
            class="logo"
        >
            more<span>moments</span>
        </a>


        <div class="header-actions">

            <a
                href="create-event.html"
                class="create"
            >
                + Buat Acara
            </a>


            <button
                type="button"
                class="logout"
                id="logoutButton"
            >
                Keluar
            </button>

        </div>

    </div>

</header>



<main class="page">


    <section class="hero">

        <div class="eyebrow">
            Dashboard Admin
        </div>


        <h1>
            Acara Anda.
        </h1>


        <p>
            Kelola semua acara,
            lihat jumlah tamu,
            foto, dan buka galeri
            dari satu tempat.
        </p>

    </section>



    <section class="summary">


        <div class="summary-card">

            <small>
                Total acara
            </small>

            <strong id="totalEvents">
                0
            </strong>

        </div>


        <div class="summary-card">

            <small>
                Total tamu
            </small>

            <strong id="totalGuests">
                0
            </strong>

        </div>


        <div class="summary-card">

            <small>
                Total foto
            </small>

            <strong id="totalPhotos">
                0
            </strong>

        </div>


    </section>



    <div class="toolbar">

        <h2>
            Daftar acara
        </h2>


        <button
            type="button"
            class="refresh"
            id="refreshButton"
        >
            ↻ Muat ulang
        </button>

    </div>



    <div
        class="status-box"
        id="statusBox"
    >
        Memuat acara...
    </div>



    <section
        class="events"
        id="events"
    ></section>


</main>



<div
    class="toast"
    id="toast"
>
    Link acara disalin
</div>



<script>

const API_URL =
    "https://moments-api.alavolaadza.workers.dev";


const ADMIN_TOKEN =
    localStorage.getItem(
        "momentsAdminToken"
    );


/* =====================================================
   WAJIB LOGIN
===================================================== */

if(!ADMIN_TOKEN){

    window.location.href =
        "login.html";

}



const eventsElement =
    document.getElementById(
        "events"
    );


const statusBox =
    document.getElementById(
        "statusBox"
    );


const toast =
    document.getElementById(
        "toast"
    );



/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatDate(value){

    if(!value){
        return "-";
    }


    const date =
        new Date(
            value +
            "T00:00:00"
        );


    return date.toLocaleDateString(
        "id-ID",
        {
            weekday:
                "long",

            day:
                "numeric",

            month:
                "long",

            year:
                "numeric"
        }
    );

}



/* =====================================================
   URL EVENT
===================================================== */

function getBaseUrl(){

    return (
        window.location.origin +
        window.location.pathname
        .replace(
            "dashboard.html",
            ""
        )
    );

}



function eventUrl(slug){

    return (
        getBaseUrl()
        +
        "event.html?e="
        +
        encodeURIComponent(
            slug
        )
    );

}



function galleryUrl(slug){

    return (
        getBaseUrl()
        +
        "gallery.html?e="
        +
        encodeURIComponent(
            slug
        )
    );

}



/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        function(){

            toast.classList.remove(
                "show"
            );

        },
        1800
    );

}



/* =====================================================
   SALIN LINK
===================================================== */

async function copyEventLink(slug){

    const link =
        eventUrl(
            slug
        );


    try{

        await navigator.clipboard
            .writeText(
                link
            );


        showToast(
            "Link acara disalin"
        );


    }catch(error){

        window.prompt(
            "Salin link acara:",
            link
        );

    }

}



/* =====================================================
   BUAT CARD EVENT
===================================================== */

function createEventCard(event){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "event-card";


    const statusClass =
        event.status ===
        "active"
        ?
        ""
        :
        " inactive";


    card.innerHTML = `

        <div class="event-head">

            <div>

                <div class="event-type">
                    ${event.eventType || "Acara"}
                </div>

                <h3 class="event-name"></h3>

            </div>


            <div class="status${statusClass}">
                ${event.status || "active"}
            </div>

        </div>


        <div class="date">

            ${formatDate(
                event.eventDate
            )}

            •

            ${event.startTime || "-"}

            –

            ${event.endTime || "-"}

        </div>


        <div class="stats">


            <div class="stat">

                <small>
                    Tamu
                </small>

                <strong>
                    ${event.guestCount}
                    /
                    ${event.maxGuests}
                </strong>

            </div>


            <div class="stat">

                <small>
                    Foto
                </small>

                <strong>
                    ${event.photoCount}
                </strong>

            </div>


            <div class="stat">

                <small>
                    Jatah
                </small>

                <strong>
                    ${event.shotsPerGuest}
                </strong>

            </div>


        </div>


        <div class="slug"></div>


        <div class="actions">

            <a class="action primary open-event">
                Buka acara
            </a>


            <a class="action open-gallery">
                Galeri
            </a>


            <button
                type="button"
                class="action full copy-link"
            >
                🔗 Salin link tamu
            </button>

        </div>

    `;


    card
        .querySelector(
            ".event-name"
        )
        .textContent =
        event.name;


    card
        .querySelector(
            ".slug"
        )
        .textContent =
        event.slug;


    card
        .querySelector(
            ".open-event"
        )
        .href =
        eventUrl(
            event.slug
        );


    card
        .querySelector(
            ".open-gallery"
        )
        .href =
        galleryUrl(
            event.slug
        );


    card
        .querySelector(
            ".copy-link"
        )
        .addEventListener(
            "click",
            function(){

                copyEventLink(
                    event.slug
                );

            }
        );


    return card;

}



/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById(
    "logoutButton"
)
.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            "momentsAdminToken"
        );


        window.location.href =
            "login.html";

    }
);



/* =====================================================
   LOAD EVENT
===================================================== */

async function loadEvents(){

    statusBox.style.display =
        "block";


    statusBox.textContent =
        "Memuat acara...";


    eventsElement.innerHTML =
        "";


    try{

        const response =
            await fetch(
                API_URL +
                "/api/events",
                {

                    headers:{

                        "Authorization":
                            "Bearer " +
                            ADMIN_TOKEN

                    }

                }
            );


        const data =
            await response.json();


        /* TOKEN HABIS / TIDAK VALID */

        if(
            response.status ===
            401
        ){

            localStorage.removeItem(
                "momentsAdminToken"
            );


            window.location.href =
                "login.html";


            return;

        }


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.error ||
                "Dashboard gagal dimuat."
            );

        }


        const events =
            data.events ||
            [];


        document
        .getElementById(
            "totalEvents"
        )
        .textContent =
            data.stats?.events ||
            0;


        document
        .getElementById(
            "totalGuests"
        )
        .textContent =
            data.stats?.guests ||
            0;


        document
        .getElementById(
            "totalPhotos"
        )
        .textContent =
            data.stats?.photos ||
            0;



        if(
            events.length ===
            0
        ){

            statusBox.textContent =
                "Belum ada acara.";

            return;

        }


        statusBox.style.display =
            "none";


        events.forEach(
            function(event){

                eventsElement
                .appendChild(
                    createEventCard(
                        event
                    )
                );

            }
        );


    }catch(error){

        console.error(
            error
        );


        statusBox.style.display =
            "block";


        statusBox.textContent =
            error.message ||
            "Dashboard gagal dimuat.";

    }

}



/* =====================================================
   REFRESH
===================================================== */

document
.getElementById(
    "refreshButton"
)
.addEventListener(
    "click",
    loadEvents
);



/* =====================================================
   MULAI
===================================================== */

loadEvents();

</script>

</body>
</html>
