<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Kamera | MoreMoments</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow:hidden;
}

.camera-app{
    width:100%;
    height:100%;
    position:relative;
    background:#000;
}

/* VIDEO */

.video-box{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#111;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TOP */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:10;

    padding:
        max(18px, env(safe-area-inset-top))
        20px
        20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:linear-gradient(
        rgba(0,0,0,.55),
        transparent
    );

    color:white;
}

.event-info small{
    display:block;
    font-size:11px;
    opacity:.75;
    margin-bottom:3px;
}

.event-info strong{
    font-size:16px;
}

.exit{
    width:42px;
    height:42px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
    color:white;
    text-decoration:none;
    font-size:21px;
}

/* COUNT */

.counter{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;

    background:rgba(0,0,0,.45);
    backdrop-filter:blur(10px);

    color:white;
    border-radius:999px;
    padding:9px 15px;

    font-size:12px;
    white-space:nowrap;
}

/* BOTTOM */

.controls{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    z-index:20;

    padding:
        25px
        24px
        max(28px, env(safe-area-inset-bottom));

    background:linear-gradient(
        transparent,
        rgba(0,0,0,.75)
    );
}

.control-row{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
}

/* PREVIEW */

.last-photo{
    width:52px;
    height:52px;
    border-radius:12px;
    border:2px solid rgba(255,255,255,.65);
    overflow:hidden;
    background:rgba(255,255,255,.15);
}

.last-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

/* SHUTTER */

.shutter-wrap{
    display:flex;
    justify-content:center;
}

.shutter{
    width:78px;
    height:78px;
    border-radius:50%;

    border:5px solid white;

    background:transparent;
    padding:5px;
    cursor:pointer;
}

.shutter-inner{
    width:100%;
    height:100%;
    background:white;
    border-radius:50%;
    transition:.12s;
}

.shutter:active .shutter-inner{
    transform:scale(.88);
}

/* SWITCH */

.switch-wrap{
    display:flex;
    justify-content:flex-end;
}

.switch{
    width:52px;
    height:52px;
    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.18);
    backdrop-filter:blur(10px);

    color:white;
    font-size:23px;
    cursor:pointer;
}

/* FLASH EFFECT */

.flash{
    position:absolute;
    inset:0;
    z-index:100;
    background:white;
    pointer-events:none;
    opacity:0;
}

.flash.active{
    animation:flash .25s ease;
}

@keyframes flash{

    0%{opacity:0;}
    40%{opacity:.9;}
    100%{opacity:0;}

}

/* PERMISSION SCREEN */

.permission{
    position:absolute;
    inset:0;
    z-index:200;

    background:#f7f4f0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;
}

.permission-card{
    max-width:390px;
    width:100%;

    text-align:center;

    background:white;
    border-radius:28px;
    padding:38px 28px;

    box-shadow:0 30px 80px rgba(0,0,0,.15);
}

.camera-icon{
    width:75px;
    height:75px;

    margin:0 auto 22px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:#eee7df;

    font-size:34px;
}

.permission h1{
    font-size:25px;
    margin-bottom:10px;
}

.permission p{
    color:#777;
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;
}

.permission button{
    width:100%;
    height:53px;

    border:0;
    border-radius:999px;

    background:#29251f;
    color:white;

    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.permission-error{
    margin-top:16px;
    color:#b34f4f;
    font-size:12px;
    line-height:1.5;
}

/* LIMIT */

.limit-screen{
    display:none;

    position:absolute;
    inset:0;
    z-index:300;

    background:#f7f4f0;

    justify-content:center;
    align-items:center;

    padding:25px;
}

.limit-card{
    background:white;
    max-width:380px;
    width:100%;

    padding:35px;
    text-align:center;

    border-radius:28px;
}

.limit-card h2{
    margin-bottom:10px;
}

.limit-card p{
    color:#777;
    line-height:1.6;
    font-size:14px;
    margin-bottom:22px;
}

.limit-card a{
    display:inline-block;
    text-decoration:none;

    background:#29251f;
    color:white;

    padding:14px 23px;
    border-radius:999px;

    font-weight:700;
    font-size:14px;
}

/* DESKTOP */

@media(min-width:700px){

    .camera-app{
        max-width:500px;
        margin:auto;
    }

    body{
        background:#111;
    }

}
</style>
</head>

<body>

<div class="camera-app">

    <div class="video-box">
        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>
    </div>


    <div class="topbar">

        <div class="event-info">
            <small id="guestName">
                Tamu
            </small>

            <strong id="eventName">
                MoreMoments
            </strong>
        </div>

        <a href="#" class="exit" id="exitButton">
            ×
        </a>

    </div>


    <div class="counter" id="counter">
        0 dari 15 foto
    </div>


    <div class="controls">

        <div class="control-row">

            <div class="last-photo">
                <img id="lastPhoto">
            </div>


            <div class="shutter-wrap">

                <button
                    class="shutter"
                    id="captureButton"
                    aria-label="Ambil foto">

                    <div class="shutter-inner"></div>

                </button>

            </div>


            <div class="switch-wrap">

                <button
                    class="switch"
                    id="switchCamera"
                    aria-label="Ganti kamera">

                    ↻

                </button>

            </div>

        </div>

    </div>


    <div class="flash" id="flash"></div>


    <!-- PERMISSION -->

    <div class="permission" id="permissionScreen">

        <div class="permission-card">

            <div class="camera-icon">
                📷
            </div>

            <h1>Izinkan kamera</h1>

            <p>
                MoreMoments memerlukan akses kamera
                agar Anda dapat mengabadikan momen acara.
            </p>

            <button id="startCamera">
                Buka Kamera
            </button>

            <div
                class="permission-error"
                id="permissionError">
            </div>

        </div>

    </div>


    <!-- LIMIT -->

    <div class="limit-screen" id="limitScreen">

        <div class="limit-card">

            <h2>Semua foto sudah diambil 🎉</h2>

            <p>
                Anda sudah menggunakan seluruh jatah foto
                untuk acara ini.
            </p>

            <a href="#" id="backEvent">
                Kembali ke Acara
            </a>

        </div>

    </div>


    <canvas id="canvas" hidden></canvas>

</div>


<script>
const API_URL =
  "https://moments-api.alavolaadza.workers.dev";
/* =====================================================
   PARAMETER EVENT
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const slug =
    params.get("e");


/* =====================================================
   LOAD EVENT
===================================================== */

let eventData = null;

const savedEvent =
    localStorage.getItem("momentsEvent");

if(savedEvent){

    try{

        eventData =
            JSON.parse(savedEvent);

    }catch(error){

        console.error(error);

    }

}


/* =====================================================
   LOAD GUEST
===================================================== */

let guest = null;

if(slug){

    const savedGuest =
        localStorage.getItem(
            "momentsGuest_" + slug
        );

    if(savedGuest){

        try{

            guest =
                JSON.parse(savedGuest);

        }catch(error){

            console.error(error);

        }

    }

}


/* =====================================================
   VALIDASI
===================================================== */

if(
    !slug ||
    !eventData ||
    eventData.slug !== slug ||
    !guest
){

    window.location.href =
        "event.html?e="
        +
        encodeURIComponent(
            slug || ""
        );

}


/* =====================================================
   ELEMENT
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const captureButton =
    document.getElementById("captureButton");

const switchButton =
    document.getElementById("switchCamera");

const permissionScreen =
    document.getElementById("permissionScreen");

const permissionError =
    document.getElementById("permissionError");

const lastPhoto =
    document.getElementById("lastPhoto");

const counter =
    document.getElementById("counter");

const flash =
    document.getElementById("flash");

const limitScreen =
    document.getElementById("limitScreen");


/* =====================================================
   INFO
===================================================== */

document.getElementById("eventName")
    .textContent =
    eventData?.name || "MoreMoments";


document.getElementById("guestName")
    .textContent =
    guest?.name || "Tamu";


document.getElementById("exitButton")
    .href =
    "event.html?e="
    +
    encodeURIComponent(slug);


document.getElementById("backEvent")
    .href =
    "event.html?e="
    +
    encodeURIComponent(slug);


/* =====================================================
   CAMERA SETTINGS
===================================================== */

let stream = null;

let facingMode =
    "environment";


/* =====================================================
   UPDATE COUNTER
===================================================== */

function updateCounter(){

    const taken =
        guest.shotsTaken || 0;

    const max =
        eventData.shots || 15;


    counter.textContent =
        taken
        +
        " dari "
        +
        max
        +
        " foto";


    if(taken >= max){

        limitScreen.style.display =
            "flex";

        stopCamera();

    }

}


updateCounter();


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

    permissionError.textContent = "";


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        permissionError.textContent =
            "Browser ini tidak mendukung akses kamera.";

        return;

    }


    try{

        stopCamera();


        const constraints = {

            audio:false,

            video:{

                facingMode:{
                    ideal:facingMode
                },

                width:{
                    ideal:1920
                },

                height:{
                    ideal:1080
                }

            }

        };


        stream =
            await navigator
            .mediaDevices
            .getUserMedia(
                constraints
            );


        video.srcObject =
            stream;


        await video.play();


        permissionScreen.style.display =
            "none";


    }catch(error){

        console.error(error);


        permissionError.innerHTML =
            "Kamera tidak dapat dibuka.<br>"
            +
            "Pastikan izin kamera sudah diberikan pada browser.";

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    if(stream){

        stream
        .getTracks()
        .forEach(track =>
            track.stop()
        );

        stream = null;

    }

}


/* =====================================================
   BUTTON CAMERA
===================================================== */

document
.getElementById("startCamera")
.addEventListener(
    "click",
    startCamera
);


/* =====================================================
   SWITCH CAMERA
===================================================== */

switchButton.addEventListener(
    "click",
    async function(){

        facingMode =
            facingMode === "environment"
            ?
            "user"
            :
            "environment";


        await startCamera();

    }
);


/* =====================================================
   CAPTURE PHOTO
===================================================== */

captureButton.addEventListener(
    "click",
    capturePhoto
);


async function capturePhoto(){

    const max =
        eventData.shots || 15;

    if(
        guest.shotsTaken >= max
    ){
        updateCounter();
        return;
    }

    if(
        !video.videoWidth ||
        !video.videoHeight
    ){
        return;
    }

    /* Cegah tombol ditekan berkali-kali */
    captureButton.disabled = true;


    try{

        /* FLASH */

        flash.classList.remove("active");

        void flash.offsetWidth;

        flash.classList.add("active");


        /* UKURAN FOTO */

        const maxWidth = 1600;

        let width =
            video.videoWidth;

        let height =
            video.videoHeight;


        if(width > maxWidth){

            const ratio =
                maxWidth / width;

            width =
                maxWidth;

            height =
                Math.round(
                    height * ratio
                );

        }


        canvas.width =
            width;

        canvas.height =
            height;


        const ctx =
            canvas.getContext("2d");


        /* KAMERA DEPAN DIBALIK */

        if(
            facingMode === "user"
        ){

            ctx.save();

            ctx.translate(
                width,
                0
            );

            ctx.scale(
                -1,
                1
            );

            ctx.drawImage(
                video,
                0,
                0,
                width,
                height
            );

            ctx.restore();

        }else{

            ctx.drawImage(
                video,
                0,
                0,
                width,
                height
            );

        }


        /* UBAH CANVAS MENJADI FILE WEBP */

        const photoBlob =
            await new Promise(
                (resolve, reject) => {

                    canvas.toBlob(
                        blob => {

                            if(blob){
                                resolve(blob);
                            }else{
                                reject(
                                    new Error(
                                        "Foto gagal diproses."
                                    )
                                );
                            }

                        },
                        "image/webp",
                        0.82
                    );

                }
            );


        /* PREVIEW FOTO */

        const previewUrl =
            URL.createObjectURL(
                photoBlob
            );

        lastPhoto.src =
            previewUrl;

        lastPhoto.style.display =
            "block";


        /* DATA UNTUK WORKER */

        const formData =
            new FormData();

        formData.append(
            "photo",
            photoBlob,
            "photo.webp"
        );

        formData.append(
            "eventId",
            eventData.id
        );

        formData.append(
            "guestId",
            guest.id
        );

        formData.append(
            "guestToken",
            guest.guestToken
        );

        formData.append(
            "width",
            String(width)
        );

        formData.append(
            "height",
            String(height)
        );


        /* UPLOAD KE CLOUDFLARE */

        const response =
            await fetch(
                API_URL +
                "/api/photos",
                {
                    method:"POST",
                    body:formData
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.error ||
                "Foto gagal disimpan."
            );

        }


        /* COUNTER DARI SERVER */

        guest.shotsTaken =
            Number(
                data.shotsTaken
            );


        localStorage.setItem(

            "momentsGuest_" + slug,

            JSON.stringify(
                guest
            )

        );


        updateCounter();


        console.log(
            "Foto tersimpan:",
            data.photo
        );


    }catch(error){

        console.error(error);

        alert(
            "Foto gagal di-upload:\n" +
            error.message
        );

    }finally{

        captureButton.disabled =
            false;

    }

}



/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    stopCamera
);

</script>

</body>
</html>
