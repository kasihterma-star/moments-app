<html lang="id">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"

<title>Edit Acara | MoreMoments</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:#f3eee8;
  color:#29241f;
  font-family:Arial,Helvetica,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}


/* HEADER */

.header{
  border-bottom:1px solid #e4d9d0;
  background:#faf8f5;
}

.header-inner{
  width:100%;
  max-width:980px;

.logo{

.logo span{

}

.back{
  min-height:42px;

  border-radius:999px;

  background:#fff;

}


/* PAGE */

.page{
  width:100%;
  max-width:850px;

  margin:auto;

  padding:45px 20px 90px;
}

.eyebrow{
  margin-bottom:10px;

  color:#a77852;

h1{
  margin-bottom:12px;

  font-family:Georgia,serif;

    38px,
    6vw,

  );

  line-height:1;

.subtitle{
  max-width:650px;

  margin-bottom:24px;

  color:#756d66;

  font-size:13px;

/* STATUS */

.status-card{
  margin-bottom:18px;

  padding:17px;

  border:1px solid #dfd5cd;
  border-radius:18px;

  background:#fff;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.status-main{
  min-width:0;
}

.status-label{
  margin-bottom:4px;

  color:#91877f;

  font-size:9px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:1px;
}

.status-title{
  font-size:14px;
  font-weight:800;
}

.status-badge{
  flex:none;

  padding:8px 12px;

  border-radius:999px;

  font-size:9px;
  font-weight:800;

  text-transform:uppercase;
}

.status-badge.waiting{
  background:#fff3dd;
  color:#9b6a20;
}

.status-badge.active{
  background:#e8f6ec;
  color:#39724a;
}

.status-badge.finished{
  background:#eeeae6;
  color:#69615b;
}

.status-badge.inactive{
  background:#f4e7e7;
  color:#8a4949;
}


/* NOTICE */

.notice{
  margin-bottom:20px;

  padding:15px 16px;

  border-radius:15px;

  background:#f7f3ef;

  color:#726960;

  font-size:11px;
  line-height:1.6;
}


/* ROLE / DURATION LIMIT */

.limit-card{
  margin-bottom:18px;
  padding:15px 16px;
  border:1px solid #dfd5cd;
  border-radius:16px;
  background:#fff;
}

.limit-title{
  margin-bottom:5px;
  font-size:11px;
  font-weight:800;
}

.limit-text{
  color:#756d66;
  font-size:10px;
  line-height:1.55;
}


/* CARD */

.card{
  padding:27px;

  border:1px solid #dfd5cd;
  border-radius:25px;

  background:#fff;
}


/* FORM */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:12px;
  font-weight:800;
}

.helper{
  color:#928981;

  font-size:10px;
  line-height:1.5;
}

input,
select{
  width:100%;
  min-height:52px;

  padding:0 14px;

  border:1px solid #ddd2ca;
  border-radius:14px;

  background:#fff;
  color:#29241f;

  outline:none;

  font-size:14px;
}

input:focus,
select:focus{
  border-color:#9c7457;

  box-shadow:
    0 0 0 3px
    rgba(156,116,87,.1);
}

input:disabled,
select:disabled{
  background:#f3f0ed;
  color:#938a83;

  cursor:not-allowed;
}


/* LINK */

.link-box{
  padding:13px 14px;

  border-radius:13px;

  background:#f7f3ef;

  color:#746b64;

  font-size:11px;
  line-height:1.5;

  word-break:break-all;
}


/* TIMEZONE */

.timezone-box{
  grid-column:1/-1;

  padding:17px;

  border-radius:18px;

  background:#f7f3ef;
}

.timezone-title{
  margin-bottom:8px;

  font-size:12px;
  font-weight:800;
}


/* SAVE */

.save-area{
  margin-top:25px;

  padding-top:23px;

  border-top:1px solid #eee5de;
}

.save-button{
  width:100%;
  min-height:55px;

  border:0;
  border-radius:999px;

  background:#29241f;
  color:#fff;

  font-size:14px;
  font-weight:800;
}

.save-button:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* MESSAGE */

.message{
  display:none;

  margin-top:14px;

  padding:14px;

  border-radius:14px;

  font-size:12px;
  line-height:1.6;
}

.message.success{
  display:block;
  background:#edf7ef;
  color:#417149;
}

.message.error{
  display:block;
  background:#fff0ef;
  color:#9c4742;
}


/* LOADING */

.loading{
  padding:50px 20px;

  text-align:center;

  color:#777;
}


/* MOBILE */

@media(max-width:650px){

  .page{
    padding:
      32px
      14px
      70px;
  }

  .card{
    padding:
      20px
      16px;
  }

  .form-grid{

  }

<body>


<header class="header">

  <div class="header-inner">

    <a
      class="logo"
      href="index.html"
    >
      more<span>moments</span>
    </a>

    <a
      class="back"
      href="dashboard.html"
    >
      ← Dashboard
    </a>

  </div>

</header>


<main
  class="page"
  id="page"
>

  <div class="loading">
    Memuat acara...
  </div>

</main>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  "https://api.ege.my.id";


const TOKEN_KEY =
  "momentsAdminToken";


const token =
  localStorage.getItem(
    TOKEN_KEY
  );


const params =
  new URLSearchParams(
    window.location.search
  );


const eventId =
  params.get("id");


let eventData =
  null;


let currentUser =
  null;


let maxDurationDays =
  1;


/* =====================================================
   LOGIN
===================================================== */

if(
  !token
){

  window.location.href =
    "login.html";
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
){

  return String(
    value || ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =====================================================
   TIMEZONE
===================================================== */

function timezoneLabel(
  timezone
){

  if(
    timezone ===
    "Asia/Jakarta"
  ){
    return "WIB";
  }


  if(
    timezone ===
    "Asia/Jayapura"
  ){
    return "WIT";
  }


  return "WITA";
}


/* =====================================================
   STATUS
===================================================== */

function statusText(
  phase
){

  if(
    phase ===
    "waiting"
  ){
    return "Belum Dimulai";
  }


  if(
    phase ===
    "active"
  ){
    return "Sedang Berlangsung";
  }


  if(
    phase ===
    "finished"
  ){
    return "Selesai";
  }


  if(
    phase ===
    "inactive"
  ){
    return "Nonaktif";
  }


  return "Tidak diketahui";
}


/* =====================================================
   LOAD
===================================================== */

async function loadEvent(){

  if(
    !eventId
  ){

    showFatal(
      "ID acara tidak ditemukan."
    );

    return;
  }


  try{

    const response =
      await fetch(
        API_URL +
        "/api/events",
        {
          headers:{
            "Authorization":
              "Bearer " +
              token
          },

          cache:
            "no-store"
        }
      );


    const data =
      await response.json();


    if(
      response.status ===
      401
    ){

      localStorage.removeItem(
        TOKEN_KEY
      );


      window.location.href =
        "login.html";

      return;
    }


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "Acara tidak dapat dimuat."
      );
    }


    currentUser =
      data.currentUser ||
      null;


    if(
      currentUser?.role ===
      "superadmin"
    ){

      maxDurationDays = 10;

    }else if(
      currentUser?.role ===
      "admin"
    ){

      maxDurationDays = 5;

    }else{

      maxDurationDays = 1;
    }


    eventData =
      (
        data.events || []
      ).find(
        event =>
          event.id ===
          eventId
      );


    if(
      !eventData
    ){

      throw new Error(
        "Acara tidak ditemukan atau Anda tidak memiliki akses."
      );
    }


    render();


  }catch(error){

    console.error(
      error
    );


    showFatal(
      error.message
    );
  }
}


/* =====================================================
   FATAL
===================================================== */

function showFatal(
  message
){

  document.getElementById(
    "page"
  ).innerHTML = `

    <div class="card">

      <h2 style="margin-bottom:10px">
        Acara tidak tersedia
      </h2>

      <p
        style="
          color:#777;
          line-height:1.6;
          font-size:13px;
        "
      >
        ${escapeHtml(message)}
      </p>

      <a
        href="dashboard.html"
        style="
          display:inline-flex;
          margin-top:20px;
          padding:13px 20px;
          border-radius:999px;
          background:#29241f;
          color:white;
          font-size:12px;
          font-weight:bold;
        "
      >
        Kembali ke Dashboard
      </a>

    </div>
  `;
}


function roleLabel(role){

  if(role === "superadmin"){
    return "SUPERADMIN";
  }

  if(role === "admin"){
    return "ADMIN";
  }

  return "USER";
}


function eventDurationMs(
  eventDate,
  startTime,
  endDate,
  endTime
){

  if(
    !eventDate ||
    !startTime ||
    !endDate ||
    !endTime
  ){
    return NaN;
  }


  const start =
    new Date(
      eventDate +
      "T" +
      startTime +
      ":00"
    );


  const end =
    new Date(
      endDate +
      "T" +
      endTime +
      ":00"
    );


  return (
    end.getTime() -
    start.getTime()
  );
}


/* =====================================================
   RENDER
===================================================== */

function render(){

  const phase =
    eventData.eventPhase;


  let notice = "";


  let dateDisabled =
    false;


  let startDisabled =
    false;


  let timezoneDisabled =
    false;


  let minimumOnly =
    false;


  let buttonText =
    "Simpan Perubahan";


  if(
    phase ===
    "waiting"
  ){

    notice =
      "Acara belum dimulai. Anda masih dapat mengubah data acara secara lengkap. Link dan QR Code tetap sama.";


  }else if(
    phase ===
    "active"
  ){

    notice =
      "Acara sedang berlangsung. Tanggal mulai, jam mulai, dan zona waktu dikunci. Anda dapat memperpanjang tanggal/jam selesai serta menambah batas tamu dan jatah foto.";


    dateDisabled =
      true;


    startDisabled =
      true;


    timezoneDisabled =
      true;


    minimumOnly =
      true;


    buttonText =
      "Simpan / Perpanjang Acara";


  }else if(
    phase ===
    "finished"
  ){

    notice =
      "Acara sudah selesai. Untuk membukanya kembali, perpanjang tanggal atau jam selesai hingga melewati waktu sekarang.";


    dateDisabled =
      true;


    startDisabled =
      true;


    timezoneDisabled =
      true;


    buttonText =
      "Perpanjang / Buka Kembali";


  }else if(
    phase ===
    "inactive"
  ){

    notice =
      "Acara sedang nonaktif. Pemilik dan superadmin tetap dapat mengelola acara. Aturan edit jadwal tetap diperiksa oleh server.";


    buttonText =
      "Simpan Perubahan";
  }


  const link =
    "https://moments-app.ege.my.id/event.html?e="
    +
    eventData.slug;


  document.getElementById(
    "page"
  ).innerHTML = `

    <div class="eyebrow">
      MoreMoments
    </div>

    <h1>
      Edit acara.
    </h1>

    <p class="subtitle">
      Atur kembali informasi acara tanpa
      mengubah link atau QR Code yang sudah
      dibagikan.
    </p>


    <div class="status-card">

      <div class="status-main">

        <div class="status-label">
          Status waktu
        </div>

        <div class="status-title">
          ${escapeHtml(eventData.name)}
        </div>

      </div>


      <div
        class="status-badge ${escapeHtml(phase)}"
      >
        ${escapeHtml(
          statusText(
            phase
          )
        )}
      </div>

    </div>


    <div class="notice">
      ${escapeHtml(notice)}
    </div>


    <div class="limit-card">
      <div class="limit-title">
        Batas durasi akun
      </div>

      <div class="limit-text">
        ${escapeHtml(
          roleLabel(
            currentUser?.role
          )
        )}
        dapat membuat acara maksimal
        ${maxDurationDays} hari.
        Server tetap menjadi pemeriksa akhir,
        terutama jika superadmin mengedit acara
        milik akun lain.
      </div>
    </div>


    <form
      class="card"
      id="editForm"
    >

      <div class="form-grid">


        <div class="field full">

          <label>
            Nama acara
          </label>

          <input
            type="text"
            id="name"
            maxlength="100"
            value="${escapeHtml(eventData.name)}"
            required
          >

        </div>


        <div class="field">

          <label>
            Jenis acara
          </label>

          <select id="eventType">

            ${eventTypeOptions(
              eventData.eventType
            )}

          </select>

        </div>


        <div class="field">

          <label>
            Link / slug
          </label>

          <input
            type="text"
            value="${escapeHtml(eventData.slug)}"
            disabled
          >

          <div class="helper">
            Link tidak dapat diubah agar QR lama tetap bekerja.
          </div>

        </div>


        <div class="field full">

          <div class="link-box">
            ${escapeHtml(link)}
          </div>

        </div>


        <div class="field">

          <label>
            Tanggal mulai
          </label>

          <input
            type="date"
            id="eventDate"

            value="${escapeHtml(eventData.eventDate)}"

            ${dateDisabled ? "disabled" : ""}

            required
          >

        </div>


        <div class="field">

          <label>
            Tanggal selesai
          </label>

          <input
            type="date"
            id="endDate"

            value="${escapeHtml(
              eventData.endDate ||
              eventData.eventDate
            )}"

            required
          >

          <div class="helper">
            Saat acara berjalan atau selesai,
            tanggal selesai hanya boleh diperpanjang.
          </div>

        </div>


        <div class="timezone-box">

          <div class="timezone-title">
            Zona waktu acara
          </div>

          <select
            id="timezone"
            ${timezoneDisabled ? "disabled" : ""}
          >

            <option
              value="Asia/Jakarta"
              ${
                eventData.timezone ===
                "Asia/Jakarta"
                ?
                "selected"
                :
                ""
              }
            >
              WIB — UTC+7
            </option>

            <option
              value="Asia/Makassar"
              ${
                eventData.timezone ===
                "Asia/Makassar"
                ?
                "selected"
                :
                ""
              }
            >
              WITA — UTC+8
            </option>

            <option
              value="Asia/Jayapura"
              ${
                eventData.timezone ===
                "Asia/Jayapura"
                ?
                "selected"
                :
                ""
              }
            >
              WIT — UTC+9
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Jam mulai
          </label>

          <input
            type="time"
            id="startTime"

            value="${escapeHtml(eventData.startTime)}"

            ${startDisabled ? "disabled" : ""}

            required
          >

        </div>


        <div class="field">

          <label>
            Jam selesai
          </label>

          <input
            type="time"
            id="endTime"

            value="${escapeHtml(eventData.endTime)}"

            required
          >

          <div class="helper">
            Saat acara berjalan atau selesai,
            tanggal/jam selesai hanya dapat diperpanjang.
          </div>

        </div>


        <div class="field">

          <label>
            Maksimal tamu
          </label>

          <input
            type="number"
            id="maxGuests"

            min="${
              minimumOnly
              ?
              eventData.maxGuests
              :
              1
            }"

            value="${eventData.maxGuests}"

            required
          >

        </div>


        <div class="field">

          <label>
            Jatah foto per tamu
          </label>

          <input
            type="number"
            id="shotsPerGuest"

            min="${
              minimumOnly
              ?
              eventData.shotsPerGuest
              :
              1
            }"

            value="${eventData.shotsPerGuest}"

            required
          >

        </div>

      </div>


      <div class="save-area">

        <button
          class="save-button"
          id="saveButton"
          type="submit"
        >
          ${escapeHtml(buttonText)}
        </button>


        <div
          class="message"
          id="message"
        ></div>

      </div>

    </form>
  `;


  document.getElementById(
    "editForm"
  ).addEventListener(
    "submit",
    saveEvent
  );


  updateEditDateLimits();


  document.getElementById(
    "eventDate"
  ).addEventListener(
    "change",
    updateEditDateLimits
  );
}


function addDays(
  dateValue,
  days
){

  if(!dateValue){
    return "";
  }


  const date =
    new Date(
      dateValue +
      "T00:00:00"
    );


  date.setDate(
    date.getDate() +
    days
  );


  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );
}


function updateEditDateLimits(){

  const start =
    document.getElementById(
      "eventDate"
    );

  const end =
    document.getElementById(
      "endDate"
    );


  if(
    !start ||
    !end ||
    !start.value
  ){
    return;
  }


  end.min =
    start.value;


  end.max =
    addDays(
      start.value,
      maxDurationDays
    );


  if(
    end.value <
    start.value
  ){

    end.value =
      start.value;
  }


  /*
    Jangan paksa event lama dipendekkan jika
    role pemilik berubah. Backend akan menentukan
    apakah jadwal boleh diubah.
  */
}


/* =====================================================
   EVENT TYPE OPTIONS
===================================================== */

function eventTypeOptions(
  selected
){

  const types = [
    "Pernikahan",
    "Ulang Tahun",
    "Wisuda",
    "Reuni",
    "Sekolah",
    "Keluarga",
    "Komunitas",
    "Lainnya"
  ];


  return types
    .map(
      type => `

        <option
          value="${escapeHtml(type)}"
          ${
            type === selected
            ?
            "selected"
            :
            ""
          }
        >
          ${escapeHtml(type)}
        </option>
      `
    )
    .join("");
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    text;


  element.className =
    "message " +
    type;
}


/* =====================================================
   SAVE
===================================================== */

async function saveEvent(
  event
){

  event.preventDefault();


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  const oldText =
    saveButton.textContent;


  saveButton.disabled =
    true;


  saveButton.textContent =
    "Menyimpan...";


  try{

    /*
    Elemen disabled tidak masalah,
    karena kita ambil nilainya langsung.
    */

    const body = {

      eventId:
        eventData.id,

      name:
        document.getElementById(
          "name"
        ).value.trim(),

      eventType:
        document.getElementById(
          "eventType"
        ).value,

      eventDate:
        document.getElementById(
          "eventDate"
        ).value,

      endDate:
        document.getElementById(
          "endDate"
        ).value,

      startTime:
        document.getElementById(
          "startTime"
        ).value,

      endTime:
        document.getElementById(
          "endTime"
        ).value,

      timezone:
        document.getElementById(
          "timezone"
        ).value,

      maxGuests:
        Number(
          document.getElementById(
            "maxGuests"
          ).value
        ),

      shotsPerGuest:
        Number(
          document.getElementById(
            "shotsPerGuest"
          ).value
        )
    };


    const durationMs =
      eventDurationMs(
        body.eventDate,
        body.startTime,
        body.endDate,
        body.endTime
      );


    if(
      !Number.isFinite(
        durationMs
      ) ||
      durationMs <= 0
    ){

      throw new Error(
        "Waktu selesai harus setelah waktu mulai."
      );
    }


    /*
      Untuk pemilik biasa, validasi frontend mengikuti role.
      Jika superadmin mengedit event milik user/admin lain,
      backend tetap menjadi pemeriksa batas akhir berdasarkan
      role pemilik event.
    */

    if(
      currentUser?.role !== "superadmin"
    ){

      const maxDurationMs =
        maxDurationDays *
        24 *
        60 *
        60 *
        1000;


      if(
        durationMs >
        maxDurationMs
      ){

        throw new Error(
          "Durasi acara maksimal "
          +
          maxDurationDays
          +
          " hari untuk akun "
          +
          roleLabel(
            currentUser?.role
          )
          +
          "."
        );
      }
    }


    const response =
      await fetch(
        API_URL +
        "/api/events/update",
        {

          method:
            "POST",

          headers:{

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              token
          },

          body:
            JSON.stringify(
              body
            )
        }
      );


    const data =
      await response.json();


    if(
      response.status ===
      401
    ){

      localStorage.removeItem(
        TOKEN_KEY
      );


      window.location.href =
        "login.html";

      return;
    }


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "Acara gagal diperbarui."
      );
    }


    showMessage(
      data.schedulePhase ===
      "active"
      ?
      "Perubahan disimpan. Acara sekarang sedang berlangsung."
      :
      "Perubahan acara berhasil disimpan.",
      "success"
    );


    /*
    Muat ulang setelah sebentar
    agar status terbaru tampil.
    */

    setTimeout(
      loadEvent,
      1000
    );


  }catch(error){

    console.error(
      error
    );


    showMessage(
      error.message ||
      "Acara gagal diperbarui.",
      "error"
    );


  }finally{

    saveButton.disabled =
      false;


    saveButton.textContent =
      oldText;
  }
}


/* =====================================================
   START
===================================================== */

loadEvent();

</script>

<script src="theme-toggle.js?v=1"></script>
</body>
