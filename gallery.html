<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri | MoreMoments</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f1ec;
    color:#25221f;
}

a{
    color:inherit;
    text-decoration:none;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(250,248,245,.92);
    border-bottom:1px solid #e7dfd7;
    backdrop-filter:blur(12px);
}

.topbar-inner{
    max-width:1200px;
    margin:auto;
    min-height:70px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.logo span{
    color:#a87854;
}

.back{
    padding:10px 16px;
    border:1px solid #ddd3ca;
    border-radius:999px;
    background:#fff;
    font-size:13px;
    font-weight:700;
}

.page{
    max-width:1200px;
    margin:auto;
    padding:48px 20px 90px;
}

.hero{
    margin-bottom:32px;
}

.eyebrow{
    color:#a87854;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.7px;
    text-transform:uppercase;
    margin-bottom:8px;
}

.hero h1{
    font-family:Georgia,serif;
    font-size:clamp(34px,6vw,58px);
    font-weight:normal;
    line-height:1.05;
    margin-bottom:12px;
}

.meta{
    color:#766f68;
    font-size:14px;
    line-height:1.6;
}

.stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.stat{
    background:#fff;
    border:1px solid #e6ddd5;
    border-radius:999px;
    padding:10px 15px;
    font-size:13px;
}

.stat strong{
    margin-right:4px;
}

.loading,
.empty,
.error{
    background:#fff;
    border:1px solid #e6ddd5;
    border-radius:22px;
    padding:35px;
    text-align:center;
    color:#777;
}

.gallery{
    columns:4 250px;
    column-gap:15px;
}

.photo-card{
    display:block;
    width:100%;
    margin:0 0 15px;
    break-inside:avoid;
    border:0;
    padding:0;
    border-radius:18px;
    overflow:hidden;
    background:#ddd;
    cursor:pointer;
    position:relative;
    box-shadow:0 8px 25px rgba(59,45,35,.08);
}

.photo-card img{
    display:block;
    width:100%;
    height:auto;
    min-height:160px;
    object-fit:cover;
    transition:transform .25s ease;
}

.photo-card:hover img{
    transform:scale(1.02);
}

.caption{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:35px 13px 12px;
    background:linear-gradient(transparent,rgba(0,0,0,.58));
    color:#fff;
    text-align:left;
    font-size:12px;
    opacity:0;
    transition:.2s;
}

.photo-card:hover .caption{
    opacity:1;
}

/* LIGHTBOX */

.lightbox{
    position:fixed;
    inset:0;
    z-index:200;
    background:rgba(18,16,14,.94);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.lightbox.open{
    display:flex;
}

.lightbox-content{
    width:min(100%,1100px);
    height:min(90vh,850px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:13px;
}

.lightbox img{
    max-width:100%;
    max-height:calc(90vh - 80px);
    object-fit:contain;
    border-radius:12px;
}

.lightbox-info{
    color:#fff;
    font-size:13px;
    text-align:center;
    opacity:.85;
}

.close{
    position:fixed;
    top:18px;
    right:18px;
    z-index:210;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    color:#fff;
    font-size:26px;
    cursor:pointer;
}

@media(max-width:600px){
    .page{
        padding-top:30px;
    }

    .gallery{
        columns:2 140px;
        column-gap:9px;
    }

    .photo-card{
        margin-bottom:9px;
        border-radius:12px;
    }

    .caption{
        display:none;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="topbar-inner">
        <a href="index.html" class="logo">
            more<span>moments</span>
        </a>

        <a href="#" class="back" id="backEvent">
            ← Kembali ke acara
        </a>
    </div>
</header>

<main class="page">
    <section class="hero">
        <div class="eyebrow">Galeri acara</div>
        <h1 id="eventName">Memuat...</h1>
        <div class="meta" id="eventMeta"></div>

        <div class="stats">
            <div class="stat">
                <strong id="photoCount">0</strong> foto
            </div>
            <div class="stat">
                <strong id="guestCount">0</strong> tamu
            </div>
        </div>
    </section>

    <div class="loading" id="loading">
        Memuat foto...
    </div>

    <div class="gallery" id="gallery"></div>
</main>

<div class="lightbox" id="lightbox">
    <button class="close" id="closeLightbox" aria-label="Tutup">×</button>

    <div class="lightbox-content">
        <img id="lightboxImage" alt="Foto acara">
        <div class="lightbox-info" id="lightboxInfo"></div>
    </div>
</div>

<script>
const API_URL =
    "https://moments-api.alavolaadza.workers.dev";

const params =
    new URLSearchParams(window.location.search);

const slug =
    params.get("e");

const gallery =
    document.getElementById("gallery");

const loading =
    document.getElementById("loading");

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const lightboxInfo =
    document.getElementById("lightboxInfo");

document.getElementById("backEvent").href =
    "event.html?e=" +
    encodeURIComponent(slug || "");

function formatDate(date){
    if(!date) return "";

    const value =
        new Date(date + "T00:00:00");

    return value.toLocaleDateString(
        "id-ID",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );
}

function formatPhotoTime(value){
    if(!value) return "";

    // SQLite CURRENT_TIMESTAMP tersimpan dalam UTC.
    const normalized =
        value.includes("T")
        ? value
        : value.replace(" ", "T") + "Z";

    const date = new Date(normalized);

    if(Number.isNaN(date.getTime())){
        return value;
    }

    return date.toLocaleString(
        "id-ID",
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    );
}

function showError(message){
    loading.className = "error";
    loading.textContent = message;
}

function openPhoto(photo){
    lightboxImage.src = photo.url;
    lightboxInfo.textContent =
        "📷 " +
        photo.guestName +
        (photo.createdAt
            ? " • " + formatPhotoTime(photo.createdAt)
            : "");

    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
}

function closePhoto(){
    lightbox.classList.remove("open");
    lightboxImage.src = "";
    document.body.style.overflow = "";
}

document
    .getElementById("closeLightbox")
    .addEventListener("click", closePhoto);

lightbox.addEventListener("click", function(e){
    if(e.target === lightbox){
        closePhoto();
    }
});

document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
        closePhoto();
    }
});

async function loadGallery(){
    if(!slug){
        showError("Link galeri tidak valid.");
        return;
    }

    try{
        const response =
            await fetch(
                API_URL +
                "/api/gallery/" +
                encodeURIComponent(slug)
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.success
        ){
            throw new Error(
                data.error ||
                "Galeri tidak dapat dimuat."
            );
        }

        document.getElementById("eventName")
            .textContent =
            data.event.name;

        document.getElementById("eventMeta")
            .textContent =
            [
                data.event.eventType,
                formatDate(data.event.eventDate)
            ]
            .filter(Boolean)
            .join(" • ");

        document.getElementById("photoCount")
            .textContent =
            data.stats.photos;

        document.getElementById("guestCount")
            .textContent =
            data.stats.guests;

        document.title =
            "Galeri " +
            data.event.name +
            " | MoreMoments";

        loading.style.display = "none";

        if(!data.photos.length){
            loading.style.display = "block";
            loading.className = "empty";
            loading.textContent =
                "Belum ada foto di acara ini.";
            return;
        }

        data.photos.forEach(photo => {
            const button =
                document.createElement("button");

            button.className =
                "photo-card";

            button.type =
                "button";

            const img =
                document.createElement("img");

            img.src =
                photo.url;

            img.alt =
                "Foto oleh " +
                photo.guestName;

            img.loading =
                "lazy";

            if(
                photo.width &&
                photo.height
            ){
                img.width =
                    photo.width;

                img.height =
                    photo.height;
            }

            const caption =
                document.createElement("div");

            caption.className =
                "caption";

            caption.textContent =
                photo.guestName;

            button.appendChild(img);
            button.appendChild(caption);

            button.addEventListener(
                "click",
                () => openPhoto(photo)
            );

            gallery.appendChild(button);
        });

    }catch(error){
        console.error(error);

        showError(
            error.message ||
            "Galeri tidak dapat dimuat."
        );
    }
}

loadGallery();
</script>

</body>
</html>
