<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri | MoreMoments</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f1ec;
    color:#25221f;
}

a{
    color:inherit;
    text-decoration:none;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(250,248,245,.92);
    border-bottom:1px solid #e7dfd7;
    backdrop-filter:blur(12px);
}

.topbar-inner{
    max-width:1200px;
    margin:auto;
    min-height:70px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.logo span{
    color:#a87854;
}

.back{
    padding:10px 16px;
    border:1px solid #ddd3ca;
    border-radius:999px;
    background:#fff;
    font-size:13px;
    font-weight:700;
}

.page{
    max-width:1200px;
    margin:auto;
    padding:48px 20px 90px;
}

.hero{
    margin-bottom:32px;
}

.eyebrow{
    color:#a87854;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.7px;
    text-transform:uppercase;
    margin-bottom:8px;
}

.hero h1{
    font-family:Georgia,serif;
    font-size:clamp(34px,6vw,58px);
    font-weight:normal;
    line-height:1.05;
    margin-bottom:12px;
}

.meta{
    color:#766f68;
    font-size:14px;
    line-height:1.6;
}

.stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.stat{
    background:#fff;
    border:1px solid #e6ddd5;
    border-radius:999px;
    padding:10px 15px;
    font-size:13px;
}

.stat strong{
    margin-right:4px;
}

.loading,
.empty,
.error{
    background:#fff;
    border:1px solid #e6ddd5;
    border-radius:22px;
    padding:35px;
    text-align:center;
    color:#777;
}

.gallery{
    columns:4 250px;
    column-gap:15px;
}

.photo-card{
    display:block;
    width:100%;
    margin:0 0 15px;
    break-inside:avoid;
    border:0;
    padding:0;
    border-radius:18px;
    overflow:hidden;
    background:#ddd;
    cursor:pointer;
    position:relative;
    box-shadow:0 8px 25px rgba(59,45,35,.08);
}

.photo-card img{
    display:block;
    width:100%;
    height:auto;
    min-height:160px;
    object-fit:cover;
    transition:transform .25s ease;
}

.photo-card:hover img{
    transform:scale(1.02);
}

.caption{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:35px 13px 12px;
    background:linear-gradient(transparent,rgba(0,0,0,.58));
    color:#fff;
    text-align:left;
    font-size:12px;
    opacity:0;
    transition:.2s;
}

.photo-card:hover .caption{
    opacity:1;
}


/* OWNER PHOTO MANAGEMENT */

.owner-tools{
    display:none;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin:0 0 24px;
}

.owner-tools.show{
    display:flex;
}

.owner-note{
    width:100%;
    color:#766f68;
    font-size:12px;
    line-height:1.5;
    margin-bottom:2px;
}

.filter-tab{
    border:1px solid #ddd3ca;
    border-radius:999px;
    background:#fff;
    color:#4b4540;
    padding:10px 15px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}

.filter-tab.active{
    background:#2d2926;
    border-color:#2d2926;
    color:#fff;
}

.photo-card.hidden-photo{
    opacity:.62;
}

.hidden-badge{
    position:absolute;
    top:12px;
    left:12px;
    z-index:3;
    padding:7px 10px;
    border-radius:999px;
    background:rgba(20,18,16,.78);
    color:#fff;
    font-size:10px;
    font-weight:800;
    backdrop-filter:blur(8px);
}

.manage-photo{
    position:absolute;
    top:10px;
    right:10px;
    z-index:4;
    min-width:42px;
    height:42px;
    padding:0 12px;
    border:0;
    border-radius:999px;
    background:rgba(20,18,16,.78);
    color:#fff;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    backdrop-filter:blur(8px);
    box-shadow:0 5px 16px rgba(0,0,0,.16);
}

.manage-photo:hover{
    background:#1d1a18;
}

.manage-photo:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.owner-empty{
    column-span:all;
    background:#fff;
    border:1px solid #e6ddd5;
    border-radius:22px;
    padding:35px;
    text-align:center;
    color:#777;
}

.lightbox-manage{
    display:none;
    border:0;
    border-radius:999px;
    padding:10px 16px;
    background:#fff;
    color:#2d2926;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}

.lightbox-manage.show{
    display:inline-block;
}


/* LIGHTBOX */


.lightbox{
    position:fixed;
    inset:0;
    z-index:200;
    background:rgba(18,16,14,.94);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.lightbox.open{
    display:flex;
}

.lightbox-content{
    width:min(100%,1100px);
    height:min(90vh,850px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:13px;
}

.lightbox img{
    max-width:100%;
    max-height:calc(90vh - 80px);
    object-fit:contain;
    border-radius:12px;
}

.lightbox-info{
    color:#fff;
    font-size:13px;
    text-align:center;
    opacity:.85;
}

.close{
    position:fixed;
    top:18px;
    right:18px;
    z-index:210;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    color:#fff;
    font-size:26px;
    cursor:pointer;
}

@media(max-width:600px){
    .page{
        padding-top:30px;
    }

    .gallery{
        columns:2 140px;
        column-gap:9px;
    }

    .photo-card{
        margin-bottom:9px;
        border-radius:12px;
    }

    .caption{
        display:none;
    }

    .manage-photo{
        top:7px;
        right:7px;
        min-width:38px;
        height:38px;
        padding:0 10px;
        font-size:10px;
    }

    .hidden-badge{
        top:8px;
        left:8px;
    }
}
</style>
<script>
(function(){
  try{
    var t=localStorage.getItem("moremomentsTheme");
    if(!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
      t="dark";
    }
    document.documentElement.setAttribute("data-theme",t||"light");
  }catch(e){
    document.documentElement.setAttribute("data-theme","light");
  }
})();
</script>

<body>

<header class="topbar">
    <div class="topbar-inner">
        <a href="index.html" class="logo">
            more<span>moments</span>
        </a>

        <a href="#" class="back" id="backEvent">
            ← Kembali ke acara
        </a>
    </div>
</header>

<main class="page">
    <section class="hero">
        <div class="eyebrow">Galeri acara</div>
        <h1 id="eventName">Memuat...</h1>
        <div class="meta" id="eventMeta"></div>

        <div class="stats">
            <div class="stat">
                <strong id="photoCount">0</strong> foto
            </div>
            <div class="stat">
                <strong id="guestCount">0</strong> tamu
            </div>
        </div>
    </section>

    <div class="owner-tools" id="ownerTools">
        <div class="owner-note">
            Kelola foto acara. Foto yang disembunyikan tidak terlihat oleh tamu, tetapi file aslinya tetap tersimpan di penyimpanan.
        </div>

        <button class="filter-tab active" id="tabVisible" type="button">
            Foto tampil
        </button>

        <button class="filter-tab" id="tabHidden" type="button">
            Disembunyikan (<span id="hiddenCount">0</span>)
        </button>
    </div>

    <div class="loading" id="loading">
        Memuat foto...
    </div>

    <div class="gallery" id="gallery"></div>
</main>

<div class="lightbox" id="lightbox">
    <button class="close" id="closeLightbox" aria-label="Tutup">×</button>

    <div class="lightbox-content">
        <img id="lightboxImage" alt="Foto acara">
        <div class="lightbox-info" id="lightboxInfo"></div>
        <button class="lightbox-manage" id="lightboxManage" type="button"></button>
    </div>
</div>


<script>
const API_URL =
    "https://api.ege.my.id";

const TOKEN_KEY =
    "momentsAdminToken";

const token =
    localStorage.getItem(
        TOKEN_KEY
    );

const params =
    new URLSearchParams(
        window.location.search
    );

const slug =
    params.get("e");

const gallery =
    document.getElementById(
        "gallery"
    );

const loading =
    document.getElementById(
        "loading"
    );

const lightbox =
    document.getElementById(
        "lightbox"
    );

const lightboxImage =
    document.getElementById(
        "lightboxImage"
    );

const lightboxInfo =
    document.getElementById(
        "lightboxInfo"
    );

const lightboxManage =
    document.getElementById(
        "lightboxManage"
    );

const ownerTools =
    document.getElementById(
        "ownerTools"
    );

const tabVisible =
    document.getElementById(
        "tabVisible"
    );

const tabHidden =
    document.getElementById(
        "tabHidden"
    );

const hiddenCount =
    document.getElementById(
        "hiddenCount"
    );

let ownerView =
    false;

let allPhotos =
    [];

let currentTab =
    "visible";

let currentLightboxPhoto =
    null;

document.getElementById(
    "backEvent"
).href =
    "event.html?e=" +
    encodeURIComponent(
        slug || ""
    );

function formatDate(date){
    if(!date){
        return "";
    }

    const value =
        new Date(
            date +
            "T00:00:00"
        );

    return value.toLocaleDateString(
        "id-ID",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );
}

function formatEventRange(
    startDate,
    endDate
){
    if(!startDate){
        return "";
    }

    const finalEndDate =
        endDate ||
        startDate;

    if(
        finalEndDate ===
        startDate
    ){
        return formatDate(
            startDate
        );
    }

    return (
        formatDate(
            startDate
        )
        +
        " – "
        +
        formatDate(
            finalEndDate
        )
    );
}

function formatPhotoTime(value){
    if(!value){
        return "";
    }

    const normalized =
        value.includes("T")
        ? value
        : value.replace(" ", "T") + "Z";

    const date =
        new Date(normalized);

    if(Number.isNaN(date.getTime())){
        return value;
    }

    return date.toLocaleString(
        "id-ID",
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    );
}

function showError(message){
    loading.style.display =
        "block";

    loading.className =
        "error";

    loading.textContent =
        message;
}

function updateStats(){
    const visiblePhotos =
        allPhotos.filter(
            photo =>
                !photo.isHidden
        );

    const hiddenPhotos =
        allPhotos.filter(
            photo =>
                photo.isHidden
        );

    document.getElementById(
        "photoCount"
    ).textContent =
        ownerView
        ? visiblePhotos.length
        : allPhotos.length;

    const guestNames =
        new Set(
            (
                ownerView
                ? visiblePhotos
                : allPhotos
            )
            .map(
                photo =>
                    String(
                        photo.guestName ||
                        ""
                    ).trim()
            )
            .filter(Boolean)
        );

    document.getElementById(
        "guestCount"
    ).textContent =
        guestNames.size;

    hiddenCount.textContent =
        hiddenPhotos.length;
}

function getDisplayedPhotos(){
    if(!ownerView){
        return allPhotos;
    }

    if(
        currentTab ===
        "hidden"
    ){
        return allPhotos.filter(
            photo =>
                photo.isHidden
        );
    }

    return allPhotos.filter(
        photo =>
            !photo.isHidden
    );
}

function openPhoto(photo){
    currentLightboxPhoto =
        photo;

    lightboxImage.src =
        photo.url;

    lightboxInfo.textContent =
        "📷 " +
        photo.guestName +
        (
            photo.createdAt
            ? " • " + formatPhotoTime(photo.createdAt)
            : ""
        );

    if(ownerView){
        lightboxManage.classList.add(
            "show"
        );

        lightboxManage.textContent =
            photo.isHidden
            ? "👁 Tampilkan kembali"
            : "🙈 Sembunyikan dari galeri";
    }else{
        lightboxManage.classList.remove(
            "show"
        );
    }

    lightbox.classList.add(
        "open"
    );

    document.body.style.overflow =
        "hidden";
}

function closePhoto(){
    lightbox.classList.remove(
        "open"
    );

    lightboxImage.src =
        "";

    currentLightboxPhoto =
        null;

    document.body.style.overflow =
        "";
}

async function setPhotoVisibility(
    photo,
    isHidden,
    button = null
){
    if(
        !ownerView ||
        !token
    ){
        return;
    }

    if(button){
        button.disabled =
            true;
    }

    try{
        const response =
            await fetch(
                API_URL +
                "/api/photos/visibility",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json",
                        "Authorization":
                            "Bearer " +
                            token
                    },
                    body:
                        JSON.stringify({
                            photoId:
                                photo.id,
                            isHidden
                        })
                }
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.success
        ){
            throw new Error(
                data.error ||
                "Status foto gagal diubah."
            );
        }

        photo.isHidden =
            Boolean(
                data.photo?.isHidden
            );

        updateStats();
        renderGallery();

        if(
            currentLightboxPhoto &&
            currentLightboxPhoto.id ===
            photo.id
        ){
            closePhoto();
        }

    }catch(error){
        alert(
            error.message ||
            "Status foto gagal diubah."
        );
    }finally{
        if(button){
            button.disabled =
                false;
        }
    }
}

function createPhotoCard(photo){
    const card =
        document.createElement(
            "div"
        );

    card.className =
        "photo-card";

    if(photo.isHidden){
        card.classList.add(
            "hidden-photo"
        );
    }

    const img =
        document.createElement(
            "img"
        );

    img.src =
        photo.url;

    img.alt =
        "Foto oleh " +
        photo.guestName;

    img.loading =
        "lazy";

    img.decoding =
        "async";

    img.addEventListener(
        "load",
        () => card.classList.add(
            "loaded"
        ),
        { once:true }
    );

    img.addEventListener(
        "error",
        () => card.classList.add(
            "loaded"
        ),
        { once:true }
    );

    if(
        photo.width &&
        photo.height
    ){
        img.width =
            photo.width;

        img.height =
            photo.height;
    }

    img.addEventListener(
        "click",
        () => openPhoto(photo)
    );

    const caption =
        document.createElement(
            "div"
        );

    caption.className =
        "caption";

    caption.textContent =
        photo.guestName;

    card.appendChild(img);
    card.appendChild(caption);

    if(
        ownerView &&
        photo.isHidden
    ){
        const badge =
            document.createElement(
                "div"
            );

        badge.className =
            "hidden-badge";

        badge.textContent =
            "Disembunyikan";

        card.appendChild(
            badge
        );
    }

    if(ownerView){
        const manageButton =
            document.createElement(
                "button"
            );

        manageButton.className =
            "manage-photo";

        manageButton.type =
            "button";

        manageButton.textContent =
            photo.isHidden
            ? "👁 Tampilkan"
            : "🙈 Sembunyikan";

        manageButton.addEventListener(
            "click",
            async event => {
                event.stopPropagation();

                const nextHidden =
                    !photo.isHidden;

                if(nextHidden){
                    const confirmed =
                        confirm(
                            "Sembunyikan foto ini dari galeri tamu?\n\nFile aslinya tetap tersimpan di Google Drive/R2."
                        );

                    if(!confirmed){
                        return;
                    }
                }

                await setPhotoVisibility(
                    photo,
                    nextHidden,
                    manageButton
                );
            }
        );

        card.appendChild(
            manageButton
        );
    }

    return card;
}

function renderGallery(){
    gallery.innerHTML =
        "";

    const displayedPhotos =
        getDisplayedPhotos();

    loading.style.display =
        "none";

    if(
        displayedPhotos.length ===
        0
    ){
        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "owner-empty";

        if(
            ownerView &&
            currentTab ===
            "hidden"
        ){
            empty.textContent =
                "Belum ada foto yang disembunyikan.";
        }else{
            empty.textContent =
                "Belum ada foto di acara ini.";
        }

        gallery.appendChild(
            empty
        );

        return;
    }

    displayedPhotos.forEach(
        photo => {
            gallery.appendChild(
                createPhotoCard(
                    photo
                )
            );
        }
    );
}

function setTab(tab){
    currentTab =
        tab;

    tabVisible.classList.toggle(
        "active",
        tab === "visible"
    );

    tabHidden.classList.toggle(
        "active",
        tab === "hidden"
    );

    renderGallery();
}

tabVisible.addEventListener(
    "click",
    () => setTab("visible")
);

tabHidden.addEventListener(
    "click",
    () => setTab("hidden")
);

document
    .getElementById(
        "closeLightbox"
    )
    .addEventListener(
        "click",
        closePhoto
    );

lightbox.addEventListener(
    "click",
    function(event){
        if(
            event.target ===
            lightbox
        ){
            closePhoto();
        }
    }
);

document.addEventListener(
    "keydown",
    function(event){
        if(
            event.key ===
            "Escape"
        ){
            closePhoto();
        }
    }
);

lightboxManage.addEventListener(
    "click",
    async function(){
        if(
            !currentLightboxPhoto
        ){
            return;
        }

        const photo =
            currentLightboxPhoto;

        const nextHidden =
            !photo.isHidden;

        if(nextHidden){
            const confirmed =
                confirm(
                    "Sembunyikan foto ini dari galeri tamu?\n\nFile aslinya tetap tersimpan di Google Drive/R2."
                );

            if(!confirmed){
                return;
            }
        }

        await setPhotoVisibility(
            photo,
            nextHidden,
            lightboxManage
        );
    }
);

async function loadGallery(){
    if(!slug){
        showError(
            "Link galeri tidak valid."
        );
        return;
    }

    try{
        const headers = {};

        if(token){
            headers["Authorization"] =
                "Bearer " +
                token;
        }

        const response =
            await fetch(
                API_URL +
                "/api/gallery/" +
                encodeURIComponent(slug),
                {
                    headers,
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.success
        ){
            throw new Error(
                data.error ||
                "Galeri tidak dapat dimuat."
            );
        }

        ownerView =
            Boolean(
                data.ownerView
            );

        allPhotos =
            (
                data.photos ||
                []
            ).map(
                photo => ({
                    ...photo,
                    isHidden:
                        Boolean(
                            photo.isHidden
                        )
                })
            );

        document.getElementById(
            "eventName"
        ).textContent =
            data.event.name;

        data.event.endDate =
            data.event.endDate ||
            data.event.end_date ||
            data.event.eventDate;

        document.getElementById(
            "eventMeta"
        ).textContent =
            [
                data.event.eventType,
                formatEventRange(
                    data.event.eventDate,
                    data.event.endDate
                )
            ]
            .filter(Boolean)
            .join(" • ");

        document.title =
            "Galeri " +
            data.event.name +
            " | MoreMoments";

        if(ownerView){
            ownerTools.classList.add(
                "show"
            );
        }else{
            ownerTools.classList.remove(
                "show"
            );
        }

        updateStats();
        renderGallery();

    }catch(error){
        console.error(error);

        showError(
            error.message ||
            "Galeri tidak dapat dimuat."
        );
    }
}

loadGallery();
</script>
