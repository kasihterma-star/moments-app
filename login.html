<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Masuk | MoreMoments</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;

  background:#eee7df;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#29251f;
}

.card{
  width:100%;
  max-width:430px;

  padding:
    34px
    28px;

  background:#fff;

  border-radius:30px;

  box-shadow:
    0
    30px
    80px
    rgba(60,45,34,.14);
}

.logo{
  text-align:center;

  font-size:24px;

  font-weight:800;

  margin-bottom:28px;
}

.logo span{
  color:#ad7c58;
}

.icon{
  width:68px;
  height:68px;

  margin:
    0
    auto
    18px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:22px;

  background:#eee7df;

  font-size:29px;
}

h1{
  text-align:center;

  font-size:28px;

  margin-bottom:8px;
}

.subtitle{
  max-width:330px;

  margin:
    0
    auto
    24px;

  text-align:center;

  color:#7c746d;

  font-size:13px;

  line-height:1.6;
}


/* TAB */

.tabs{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:5px;

  margin-bottom:24px;

  padding:5px;

  background:#f1ede9;

  border-radius:999px;
}

.tab{
  height:42px;

  border:0;

  border-radius:999px;

  background:transparent;

  color:#736c66;

  font-weight:700;

  cursor:pointer;
}

.tab.active{
  background:#fff;

  color:#29251f;

  box-shadow:
    0
    3px
    10px
    rgba(40,30,20,.08);
}


/* FORM */

.form{
  display:none;
}

.form.active{
  display:block;
}

.field{
  margin-bottom:15px;
}

label{
  display:block;

  margin-bottom:7px;

  font-size:12px;

  font-weight:700;
}

.input-wrap{
  position:relative;
}

input{
  width:100%;

  height:53px;

  padding:
    0
    15px;

  border:
    1px solid
    #ded5ce;

  border-radius:15px;

  outline:none;

  background:#fff;

  color:#29251f;

  font-size:15px;
}

input.password{
  padding-right:52px;
}

input:focus{
  border-color:#9b7255;

  box-shadow:
    0
    0
    0
    3px
    rgba(155,114,85,.10);
}

.show-password{
  position:absolute;

  right:7px;
  top:6px;

  width:41px;
  height:41px;

  border:0;

  border-radius:12px;

  background:transparent;

  cursor:pointer;

  font-size:17px;
}

.main-button{
  width:100%;

  height:54px;

  margin-top:3px;

  border:0;

  border-radius:999px;

  background:#29251f;

  color:#fff;

  font-size:14px;

  font-weight:700;

  cursor:pointer;
}

.main-button:disabled{
  opacity:.55;

  cursor:not-allowed;
}

.info{
  margin-top:14px;

  color:#918981;

  text-align:center;

  font-size:11px;

  line-height:1.5;
}


/* MESSAGE */

.message{
  display:none;

  margin-top:16px;

  padding:13px 14px;

  border-radius:13px;

  font-size:12px;

  line-height:1.5;
}

.message.error{
  display:block;

  border:
    1px solid
    #efcccc;

  background:#fff2f2;

  color:#9b4242;
}

.message.success{
  display:block;

  border:
    1px solid
    #cce4d0;

  background:#f0faf2;

  color:#357044;
}

.back{
  display:block;

  margin-top:23px;

  text-align:center;

  color:#89817b;

  text-decoration:none;

  font-size:12px;
}

@media(max-width:480px){

  body{
    padding:15px;
  }

  .card{
    padding:
      30px
      20px;
  }

}

</style>
</head>


<body>

<div class="card">


  <div class="logo">
    more<span>moments</span>
  </div>


  <div class="icon">
    📸
  </div>


  <h1 id="title">
    Selamat datang
  </h1>


  <div
    class="subtitle"
    id="subtitle"
  >
    Masuk untuk melihat dan
    mengelola acara Anda.
  </div>



  <div class="tabs">

    <button
      type="button"
      class="tab active"
      id="loginTab"
    >
      Masuk
    </button>


    <button
      type="button"
      class="tab"
      id="registerTab"
    >
      Daftar
    </button>

  </div>



  <!-- ==============================
       LOGIN
  =============================== -->

  <form
    class="form active"
    id="loginForm"
  >


    <div class="field">

      <label>
        Email
      </label>

      <input
        type="email"
        id="loginEmail"
        placeholder="nama@email.com"
        autocomplete="email"
        required
      >

    </div>



    <div class="field">

      <label>
        Password
      </label>


      <div class="input-wrap">

        <input
          type="password"
          class="password"
          id="loginPassword"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >


        <button
          type="button"
          class="show-password"
          data-target="loginPassword"
        >
          👁
        </button>

      </div>

    </div>



    <button
      type="submit"
      class="main-button"
      id="loginButton"
    >
      Masuk ke Dashboard
    </button>


    <div class="info">
      Gunakan akun yang sudah
      Anda daftarkan.
    </div>

  </form>



  <!-- ==============================
       REGISTER
  =============================== -->

  <form
    class="form"
    id="registerForm"
  >


    <div class="field">

      <label>
        Nama
      </label>

      <input
        type="text"
        id="registerName"
        placeholder="Nama Anda"
        autocomplete="name"
        maxlength="80"
        required
      >

    </div>



    <div class="field">

      <label>
        Email
      </label>

      <input
        type="email"
        id="registerEmail"
        placeholder="nama@email.com"
        autocomplete="email"
        required
      >

    </div>



    <div class="field">

      <label>
        Password
      </label>


      <div class="input-wrap">

        <input
          type="password"
          class="password"
          id="registerPassword"
          placeholder="Minimal 8 karakter"
          autocomplete="new-password"
          minlength="8"
          required
        >


        <button
          type="button"
          class="show-password"
          data-target="registerPassword"
        >
          👁
        </button>

      </div>

    </div>



    <div class="field">

      <label>
        Ulangi Password
      </label>


      <div class="input-wrap">

        <input
          type="password"
          class="password"
          id="registerPassword2"
          placeholder="Ketik lagi password"
          autocomplete="new-password"
          minlength="8"
          required
        >


        <button
          type="button"
          class="show-password"
          data-target="registerPassword2"
        >
          👁
        </button>

      </div>

    </div>



    <button
      type="submit"
      class="main-button"
      id="registerButton"
    >
      Buat Akun
    </button>


    <div class="info">
      Dengan mendaftar, Anda dapat
      membuat dan mengelola acara sendiri.
    </div>

  </form>



  <div
    id="message"
    class="message"
  ></div>


  <a
    href="index.html"
    class="back"
  >
    ← Kembali ke halaman utama
  </a>


</div>



<script>

const API_URL =
  "https://moments-api.alavolaadza.workers.dev";


const TOKEN_KEY =
  "momentsAdminToken";


const USER_KEY =
  "momentsUser";


const loginTab =
  document.getElementById(
    "loginTab"
  );


const registerTab =
  document.getElementById(
    "registerTab"
  );


const loginForm =
  document.getElementById(
    "loginForm"
  );


const registerForm =
  document.getElementById(
    "registerForm"
  );


const message =
  document.getElementById(
    "message"
  );


const title =
  document.getElementById(
    "title"
  );


const subtitle =
  document.getElementById(
    "subtitle"
  );



/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type = "error"
){

  message.className =
    "message " +
    type;


  message.textContent =
    text;

}


function clearMessage(){

  message.className =
    "message";


  message.textContent =
    "";

}



/* =========================================
   TAB LOGIN
========================================= */

function showLogin(){

  clearMessage();


  loginTab.classList.add(
    "active"
  );


  registerTab.classList.remove(
    "active"
  );


  loginForm.classList.add(
    "active"
  );


  registerForm.classList.remove(
    "active"
  );


  title.textContent =
    "Selamat datang";


  subtitle.textContent =
    "Masuk untuk melihat dan mengelola acara Anda.";

}



/* =========================================
   TAB REGISTER
========================================= */

function showRegister(){

  clearMessage();


  registerTab.classList.add(
    "active"
  );


  loginTab.classList.remove(
    "active"
  );


  registerForm.classList.add(
    "active"
  );


  loginForm.classList.remove(
    "active"
  );


  title.textContent =
    "Buat akun";


  subtitle.textContent =
    "Daftar untuk membuat event dan menyimpan momen Anda.";

}


loginTab.addEventListener(
  "click",
  showLogin
);


registerTab.addEventListener(
  "click",
  showRegister
);



/* =========================================
   SHOW PASSWORD
========================================= */

document
.querySelectorAll(
  ".show-password"
)
.forEach(
  function(button){

    button.addEventListener(
      "click",
      function(){

        const target =
          document.getElementById(
            button.dataset.target
          );


        if(
          target.type ===
          "password"
        ){

          target.type =
            "text";

          button.textContent =
            "🙈";

        }else{

          target.type =
            "password";

          button.textContent =
            "👁";

        }

      }
    );

  }
);



/* =========================================
   SIMPAN SESSION
========================================= */

function saveSession(
  token,
  user
){

  localStorage.setItem(
    TOKEN_KEY,
    token
  );


  localStorage.setItem(
    USER_KEY,
    JSON.stringify(
      user
    )
  );

}



/* =========================================
   CEK LOGIN YANG SUDAH ADA
========================================= */

async function checkSession(){

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  if(!token){
    return;
  }


  try{

    const response =
      await fetch(
        API_URL +
        "/api/auth/me",
        {

          headers:{
            "Authorization":
              "Bearer " +
              token
          }

        }
      );


    const data =
      await response.json();


    if(
      response.ok &&
      data.success
    ){

      localStorage.setItem(
        USER_KEY,
        JSON.stringify(
          data.user
        )
      );


      window.location.href =
        "dashboard.html";


      return;

    }


    localStorage.removeItem(
      TOKEN_KEY
    );


    localStorage.removeItem(
      USER_KEY
    );


  }catch(error){

    console.error(
      error
    );

  }

}



/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    clearMessage();


    const button =
      document.getElementById(
        "loginButton"
      );


    button.disabled =
      true;


    button.textContent =
      "Memeriksa...";


    try{

      const response =
        await fetch(
          API_URL +
          "/api/auth/login",
          {

            method:
              "POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                email:
                  document
                  .getElementById(
                    "loginEmail"
                  )
                  .value
                  .trim(),

                password:
                  document
                  .getElementById(
                    "loginPassword"
                  )
                  .value

              })

          }
        );


      const data =
        await response.json();


      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(
          data.error ||
          "Login gagal."
        );

      }


      saveSession(
        data.token,
        data.user
      );


      showMessage(
        "Login berhasil. Membuka dashboard...",
        "success"
      );


      setTimeout(
        function(){

          window.location.href =
            "dashboard.html";

        },
        500
      );


    }catch(error){

      showMessage(
        error.message ||
        "Login gagal."
      );


    }finally{

      button.disabled =
        false;


      button.textContent =
        "Masuk ke Dashboard";

    }

  }
);



/* =========================================
   REGISTER
========================================= */

registerForm.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    clearMessage();


    const name =
      document
      .getElementById(
        "registerName"
      )
      .value
      .trim();


    const email =
      document
      .getElementById(
        "registerEmail"
      )
      .value
      .trim();


    const password =
      document
      .getElementById(
        "registerPassword"
      )
      .value;


    const password2 =
      document
      .getElementById(
        "registerPassword2"
      )
      .value;


    if(
      password !==
      password2
    ){

      showMessage(
        "Konfirmasi password tidak sama."
      );

      return;

    }


    if(
      password.length <
      8
    ){

      showMessage(
        "Password minimal 8 karakter."
      );

      return;

    }


    const button =
      document.getElementById(
        "registerButton"
      );


    button.disabled =
      true;


    button.textContent =
      "Membuat akun...";


    try{

      const response =
        await fetch(
          API_URL +
          "/api/auth/register",
          {

            method:
              "POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                name:
                  name,

                email:
                  email,

                password:
                  password

              })

          }
        );


      const data =
        await response.json();


      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(
          data.error ||
          "Gagal membuat akun."
        );

      }


      saveSession(
        data.token,
        data.user
      );


      showMessage(
        "Akun berhasil dibuat. Membuka dashboard...",
        "success"
      );


      setTimeout(
        function(){

          window.location.href =
            "dashboard.html";

        },
        600
      );


    }catch(error){

      showMessage(
        error.message ||
        "Gagal membuat akun."
      );


    }finally{

      button.disabled =
        false;


      button.textContent =
        "Buat Akun";

    }

  }
);



checkSession();

</script>

</body>
</html>
